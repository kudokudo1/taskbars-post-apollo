name: Non-CPU sampled-glow contracts

on:
  pull_request:
    paths:
      - "modules/Clock.qml"
      - "modules/Volumebar.qml"
      - "modules/Workspaces.qml"
      - "tests/components/test_non_cpu_visual_glow_contracts.py"
      - ".github/workflows/non-cpu-glow-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "modules/Clock.qml"
      - "modules/Volumebar.qml"
      - "modules/Workspaces.qml"
      - "tests/components/test_non_cpu_visual_glow_contracts.py"
      - ".github/workflows/non-cpu-glow-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify non-CPU sampled-glow structure
        run: python3 tests/components/test_non_cpu_visual_glow_contracts.py
